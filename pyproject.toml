[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbody"
version = "0.1.0b1"
description = "A Python library for computing blackbody radiation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Jamal Mustafa" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
]
dependencies = [
  "numpy",
  "scipy",
]

[dependency-groups]
dev = [
  "matplotlib",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-mypy",
]

[project.optional-dependencies]
examples = [
  "matplotlib"
]

[project.urls]
Documentation = "https://jimustafa.github.io/blackbody"
Issues = "https://github.com/jimustafa/blackbody/issues"
Source = "https://github.com/jimustafa/blackbody"

[tool.autopep8]
select = ["E231"]

[tool.coverage.report]
show_missing = true

[tool.flake8]
ignore = [
  "E20", "E22", "E501", "E731",
]

[tool.hatch.build]
only-packages = true
packages = ["src/blackbody"]

[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --mypy --cov=blackbody"
