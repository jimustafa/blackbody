[project]
name = "blackbody"
version = "0.1.0"
description = "A Python library for computing blackbody radiation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jamal Mustafa", email = "jimustafa@gmail.com" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<3.0",
  "scipy>=1.13,<1.16",
]

[dependency-groups]
dev = [
  "matplotlib",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-mypy",
]

[project.optional-dependencies]
examples = [
  "matplotlib",
]

[project.urls]
Documentation = "https://jimustafa.github.io/blackbody"
Issues = "https://github.com/jimustafa/blackbody/issues"
Source = "https://github.com/jimustafa/blackbody"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 96
lint.extend-select = [
  "I",
]

[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --mypy --cov=blackbody"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-packages = true
packages = ["src/blackbody"]
